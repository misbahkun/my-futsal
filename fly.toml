# fly.toml app configuration file generated for my-futsal on 2025-04-18T17:39:41+07:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'my-futsal'
primary_region = 'sin'
console_command = 'php /var/www/html/artisan tinker'

[build]
  [build.args]
    NODE_VERSION = '18'
    PHP_VERSION = '8.2'

[env]
  APP_ENV = 'production'
  APP_URL = "https://my-futsal.fly.dev"
  APP_DEBUG = false
  APP_HOST = "0.0.0.0"
  APP_PORT = "8080"
  APP_TIMEZONE='Asia/Jakarta'
  APP_MAINTENANCE_DRIVER='file'
  PHP_CLI_SERVER_WORKERS=4
  BCRYPT_ROUNDS=12
  LOG_CHANNEL = 'stderr'
  LOG_LEVEL = 'info'
  LOG_STDERR_FORMATTER = 'Monolog\Formatter\JsonFormatter'
  SESSION_DRIVER='database'
  SESSION_LIFETIME=120
  SESSION_ENCRYPT=false
  SESSION_PATH='/'
  SESSION_DOMAIN=''
  MAIL_MAILER='smtp'
  MAIL_SCHEME='null'
  MAIL_HOST='smtp.gmail.com'
  MAIL_PORT=587
  VITE_APP_NAME="${APP_NAME}"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  size = 'shared-cpu-1x'
