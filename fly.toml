# fly.toml app configuration file generated for my-futsal-twilight-frost-2029 on 2025-08-13T08:56:06+07:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'my-futsal-twilight-frost-2029'
primary_region = 'sin'
console_command = 'php /var/www/html/artisan tinker'

[build]
  [build.args]
    NODE_VERSION = '18'
    PHP_VERSION = '8.2'

[env]
  APP_DEBUG = 'false'
  APP_ENV = 'production'
  APP_HOST = '0.0.0.0'
  APP_MAINTENANCE_DRIVER = 'file'
  APP_PORT = '8080'
  APP_TIMEZONE = 'Asia/Jakarta'
  APP_URL = 'https://my-futsal-twilight-frost-2029.fly.dev'
  BCRYPT_ROUNDS = '12'
  LOG_CHANNEL = 'stderr'
  LOG_LEVEL = 'info'
  LOG_STDERR_FORMATTER = 'Monolog\Formatter\JsonFormatter'
  MAIL_HOST = 'smtp.gmail.com'
  MAIL_MAILER = 'smtp'
  MAIL_PORT = '587'
  MAIL_SCHEME = 'null'
  MAIL_ENCRYPTION='tls'
  MAIL_FROM_ADDRESS="mizzc0d3@gmail.com"
  MAIL_FROM_NAME="${APP_NAME}"
  PHP_CLI_SERVER_WORKERS = '4'
  SESSION_DOMAIN = ''
  SESSION_DRIVER = 'cookie'
  SESSION_ENCRYPT = 'false'
  SESSION_LIFETIME = '120'
  SESSION_PATH = '/'
  SESSION_SECURE_COOKIE = 'true'
  VITE_APP_NAME = '${APP_NAME}'
  MIDTRANS_IS_PRODUCTION='false'
  MIDTRANS_SANITIZE='true'
  MIDTRANS_3DS='true'
  DB_CONNECTION='mysql'
  DB_PORT='3306'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  size = 'shared-cpu-1x'
